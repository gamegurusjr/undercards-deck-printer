# Render.com blueprint for the cloud copy of Undercards Deck Printer.
#
# This folder (nonlocal/) is the ONLY thing that gets pushed to the host repo;
# the local tool in the repo root stays untouched and always binds to
# 127.0.0.1.  On Render: New -> Blueprint -> connect the repo that contains
# just this folder, and it will pick up these settings automatically.
#
# The deployment is PUBLIC by default (no login prompt for visitors).  To
# lock it down later, uncomment the UC_ACCESS_TOKEN block at the bottom (or
# add the variable in Render's dashboard) - see README.

services:
  - type: web
    name: undercards-deck-printer
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.webapp
    healthCheckPath: /api/health
    envVars:
      # Must listen on all interfaces for Render's router to reach it.
      - key: UC_BIND
        value: 0.0.0.0
      # The free plan runs a single process anyway; explicit is fine.
      - key: WEB_CONCURRENCY
        value: 1
      # Optionally lock the deployment so only people with your secret can
      # use it.  uncomment both lines to be prompted for a value on deploy:
      # - key: UC_ACCESS_TOKEN
      #   sync: false
